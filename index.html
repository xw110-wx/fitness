<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#10b981">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.json">
<title>随记</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --primary: #10b981; --primary-dark: #059669; --primary-light: #d1fae5;
  --bg: #f0fdf4; --surface: #ffffff; --text: #1e293b; --text2: #64748b;
  --text3: #94a3b8; --border: #e2e8f0; --danger: #ef4444; --warn: #f59e0b;
  --info: #3b82f6; --radius: 12px; --shadow: 0 1px 3px rgba(0,0,0,.08);
  --nav-h: 64px; --header-h: 52px; --max-w: 480px;
}
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
  background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
.app { max-width: var(--max-w); margin: 0 auto; height: 100%; display: flex; flex-direction: column; }
/* Header */
.header {
  height: var(--header-h); display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--border);
  flex-shrink: 0; position: relative; z-index: 10;
}
.header h1 { font-size: 18px; font-weight: 700; color: var(--primary-dark); }
.header .date-badge { font-size: 12px; color: var(--text2); }
/* Main */
.main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 0 8px; }
.tab-page { display: none; padding: 12px 16px 4px; }
.tab-page.active { display: block; }
/* Bottom Nav */
.nav {
  height: var(--nav-h); display: flex; background: var(--surface);
  border-top: 1px solid var(--border); flex-shrink: 0; position: relative; z-index: 10;
}
.nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 2px; font-size: 11px; color: var(--text3); cursor: pointer; transition: color .15s;
  border: none; background: none; padding: 4px 0;
}
.nav-item .nav-icon { font-size: 22px; line-height: 1; }
.nav-item.active { color: var(--primary); }
.nav-item:active { opacity: .6; }
/* Cards */
.card { background: var(--surface); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card-title { font-size: 14px; font-weight: 600; color: var(--text2); margin-bottom: 12px; }
/* Stats Grid */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.stat-box {
  background: var(--surface); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); position: relative; overflow: hidden;
}
.stat-box .stat-label { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.stat-box .stat-value { font-size: 22px; font-weight: 700; color: var(--text); }
.stat-box .stat-unit { font-size: 13px; font-weight: 400; color: var(--text2); margin-left: 2px; }
.stat-box .stat-sub { font-size: 12px; color: var(--text3); margin-top: 2px; }
.stat-box .stat-icon { position: absolute; right: 12px; top: 12px; font-size: 28px; opacity: .15; }
/* Forms */
.form-group { margin-bottom: 12px; }
.form-label { display: block; font-size: 13px; font-weight: 500; color: var(--text2); margin-bottom: 4px; }
.form-input, .form-select {
  width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 8px;
  font-size: 15px; color: var(--text); background: var(--surface); outline: none; transition: border-color .15s;
  -webkit-appearance: none; font-family: inherit;
}
.form-input:focus, .form-select:focus { border-color: var(--primary); }
.form-input::placeholder { color: var(--text3); }
textarea.form-input { resize: vertical; min-height: 60px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600;
  border: none; cursor: pointer; transition: all .15s; font-family: inherit; min-height: 44px;
}
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text2); }
.btn-outline:hover { border-color: var(--primary); color: var(--primary); }
.btn-sm { padding: 6px 12px; font-size: 12px; min-height: 32px; }
.btn-block { width: 100%; }
.btn-danger { background: var(--danger); color: #fff; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
/* Lists */
.list-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 0; border-bottom: 1px solid var(--border);
}
.list-item:last-child { border-bottom: none; }
.list-item .li-left { display: flex; flex-direction: column; gap: 2px; }
.list-item .li-title { font-size: 14px; font-weight: 500; }
.list-item .li-sub { font-size: 12px; color: var(--text3); }
.list-item .li-right { text-align: right; font-weight: 600; font-size: 14px; }
/* Progress bar */
.progress-bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin: 6px 0; }
.progress-fill { height: 100%; border-radius: 4px; background: var(--primary); transition: width .3s; }
.progress-fill.over { background: var(--warn); }
.progress-fill.danger { background: var(--danger); }
/* Meal type tabs */
.meal-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.meal-tab {
  padding: 6px 14px; border-radius: 20px; font-size: 13px; border: 1.5px solid var(--border);
  background: var(--surface); color: var(--text2); cursor: pointer; font-family: inherit; transition: all .15s;
}
.meal-tab.active { background: var(--primary-light); border-color: var(--primary); color: var(--primary-dark); font-weight: 600; }
/* Empty state */
.empty { text-align: center; padding: 32px 16px; color: var(--text3); font-size: 14px; }
.empty-icon { font-size: 48px; margin-bottom: 8px; opacity: .5; }
/* Chart container */
.chart-wrap { width: 100%; height: 200px; position: relative; margin-bottom: 8px; }
.chart-wrap canvas { width: 100%; height: 100%; }
/* Badge */
.badge {
  display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px;
  font-weight: 500; background: var(--primary-light); color: var(--primary-dark);
}
/* Toggle section */
.toggle-section { margin-bottom: 12px; }
.toggle-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0; cursor: pointer; user-select: none;
}
.toggle-header .arrow { transition: transform .2s; font-size: 12px; }
.toggle-header.open .arrow { transform: rotate(180deg); }
.toggle-body { display: none; }
.toggle-body.open { display: block; }
/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100;
  display: none; align-items: flex-end; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--surface); border-radius: 16px 16px 0 0; width: 100%;
  max-width: var(--max-w); max-height: 80vh; overflow-y: auto; padding: 20px;
  animation: slideUp .25s ease;
}
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-title { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
.modal-close {
  position: absolute; top: 16px; right: 16px; background: none; border: none;
  font-size: 24px; color: var(--text3); cursor: pointer;
}
/* Confirm dialog */
.confirm-box {
  position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200;
  display: none; align-items: center; justify-content: center; padding: 24px;
}
.confirm-box.show { display: flex; }
.confirm-dialog {
  background: var(--surface); border-radius: var(--radius); padding: 24px;
  max-width: 320px; width: 100%; text-align: center;
}
.confirm-msg { font-size: 15px; margin-bottom: 20px; line-height: 1.6; }
.confirm-actions { display: flex; gap: 10px; }
.confirm-actions .btn { flex: 1; }
/* Toast */
.toast {
  position: fixed; bottom: calc(var(--nav-h) + 20px); left: 50%; transform: translateX(-50%);
  background: var(--text); color: #fff; padding: 10px 24px; border-radius: 8px;
  font-size: 14px; z-index: 300; display: none; white-space: nowrap; max-width: 90%;
}
.toast.show { display: block; animation: toastIn .3s ease; }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
/* Misc */
.text-center { text-align: center; }
.text-right { text-align: right; }
.mt-8 { margin-top: 8px; }
.mt-12 { margin-top: 12px; }
.mb-8 { margin-bottom: 8px; }
.mb-12 { margin-bottom: 12px; }
.color-green { color: var(--primary); }
.color-red { color: var(--danger); }
.color-warn { color: var(--warn); }
.flex-between { display: flex; justify-content: space-between; align-items: center; }
/* Scrollbar */
.main::-webkit-scrollbar { width: 0; }
/* Header responsive */
@media (max-width: 380px) {
  .stats-grid { grid-template-columns: 1fr; }
  .form-row { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="header">
    <h1>📝 随记</h1>
    <span class="date-badge" id="headerDate"></span>
  </header>
  <div class="main" id="mainContent">
    <!-- Page: Dashboard -->
    <div class="tab-page active" id="pageHome">
      <div class="card" id="dashCombinedCard">
        <div id="dashCombined"></div>
      </div>
      <div class="card" id="dashWorkoutCard">
        <div class="card-title">🏋️ 下次训练建议</div>
        <div id="dashNextWorkout"></div>
      </div>
      <div class="card" id="dashPlanCard">
        <div class="card-title">📋 接下来三天计划</div>
        <div id="dashPlan"></div>
      </div>
      <div class="card">
        <div class="card-title">⚡ 快捷操作</div>
        <div class="btn-group">
          <button class="btn btn-outline btn-sm" onclick="showModal('weightModal')">📝 记录体重</button>
          <button class="btn btn-outline btn-sm" onclick="switchTab(2)">🍚 记饮食</button>
          <button class="btn btn-outline btn-sm" onclick="switchTab(3)">🏃 记运动</button>
          <button class="btn btn-outline btn-sm" onclick="switchTab(4)">📏 量维度</button>
        </div>
      </div>
    </div>
    <!-- Page: Weight -->
    <div class="tab-page" id="pageWeight">
      <div class="card">
        <div class="card-title">📈 体重趋势</div>
        <div class="chart-wrap"><canvas id="weightChart"></canvas></div>
        <div id="weightStats" class="flex-between" style="font-size:13px;color:var(--text3);"></div>
      </div>
      <div class="card">
        <div class="flex-between mb-8">
          <span class="card-title" style="margin-bottom:0;">📋 体重记录</span>
          <button class="btn btn-primary btn-sm" onclick="showModal('weightModal')">+ 记录</button>
        </div>
        <div id="weightList"></div>
      </div>
    </div>
    <!-- Page: Diet -->
    <div class="tab-page" id="pageDiet">
      <div class="card">
        <div class="flex-between mb-8">
          <span class="card-title" style="margin-bottom:0;">🍽️ 饮食记录</span>
          <div>
            <button class="btn btn-outline btn-sm" onclick="dietDateOffset(-1)">‹</button>
            <span id="dietDateLabel" style="font-size:13px;margin:0 8px;color:var(--text2);">今天</span>
            <button class="btn btn-outline btn-sm" onclick="dietDateOffset(1)">›</button>
          </div>
        </div>
        <div id="dietSummary" class="mb-8" style="font-size:13px;"></div>
        <div class="meal-tabs" id="mealTabs"></div>
        <div id="mealFoods"></div>
        <button class="btn btn-outline btn-sm mt-8" onclick="showModal('foodModal')">+ 添加食物</button>
      </div>
      <div class="card">
        <div class="card-title">📊 今日营养总览</div>
        <div id="dietNutrition"></div>
      </div>
    </div>
    <!-- Page: Exercise -->
    <div class="tab-page" id="pageExercise">
      <div class="card">
        <div class="flex-between mb-8">
          <span class="card-title" style="margin-bottom:0;">🏃 运动记录</span>
          <div>
            <button class="btn btn-outline btn-sm" onclick="exDateOffset(-1)">‹</button>
            <span id="exDateLabel" style="font-size:13px;margin:0 8px;color:var(--text2);">今天</span>
            <button class="btn btn-outline btn-sm" onclick="exDateOffset(1)">›</button>
          </div>
        </div>
        <button class="btn btn-primary btn-block mb-12" onclick="showModal('exModal')">+ 记录运动</button>
        <div id="exList"></div>
      </div>
      <div class="card">
        <div class="card-title">📊 本周运动统计</div>
        <div id="exWeekStats"></div>
      </div>
    </div>
    <!-- Page: More -->
    <div class="tab-page" id="pageMore">
      <div class="card">
        <div class="card-title">📏 身体维度</div>
        <div class="chart-wrap" style="height:160px;"><canvas id="waistChart"></canvas></div>
        <button class="btn btn-outline btn-sm" onclick="showModal('measureModal')">+ 记录维度</button>
        <div id="measureList" class="mt-8"></div>
      </div>
      <div class="card">
        <div class="card-title">🎯 目标设置</div>
        <div class="form-group">
          <label class="form-label">目标体重 (斤)</label>
          <input class="form-input" type="number" id="goalWeight" step="0.1" onchange="saveGoal()">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label">每日热量目标 (kcal)</label>
            <input class="form-input" type="number" id="goalCalories" onchange="saveGoal()">
          </div>
          <div class="form-group">
            <label class="form-label">每周运动 (天)</label>
            <input class="form-input" type="number" id="goalExercise" min="1" max="7" onchange="saveGoal()">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">训练方向</label>
          <select class="form-select" id="goalDirection" onchange="saveGoal()">
            <option value="减脂">减脂</option>
            <option value="增肌">增肌</option>
            <option value="保持">保持</option>
          </select>
        </div>
      </div>
      <div class="card">
        <div class="card-title">💾 数据管理</div>
        <div class="btn-group">
          <button class="btn btn-outline btn-sm" onclick="exportData()">📤 导出数据</button>
          <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFile').click()">📥 导入数据</button>
          <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(event)">
          <button class="btn btn-outline btn-sm" onclick="clearAllData()" style="color:var(--danger);">🗑️ 清空数据</button>
        </div>
      </div>
    <!-- Page: Recipe -->
    <div class="tab-page" id="pageRecipe">
      <div class="card">
        <div class="card-title">🥗 菜谱推荐</div>
        <div class="meal-tabs" id="recipeTypeFilter">
          <button class="meal-tab active" onclick="filterRecipe('all')">全部</button>
          <button class="meal-tab" onclick="filterRecipe('breakfast')">🌅 早餐</button>
          <button class="meal-tab" onclick="filterRecipe('lunch')">☀️ 午餐</button>
          <button class="meal-tab" onclick="filterRecipe('dinner')">🌙 晚餐</button>
          <button class="meal-tab" onclick="filterRecipe('snack')">🍪 加餐</button>
        </div>
        <div class="btn-group mb-8" id="recipeTagFilter"></div>
        <div id="recipeList"></div>
      </div>
    </div>
  </div>
  <nav class="nav" id="bottomNav">
    <button class="nav-item active" data-tab="0"><span class="nav-icon">🏠</span>首页</button>
    <button class="nav-item" data-tab="1"><span class="nav-icon">⚖️</span>体重</button>
    <button class="nav-item" data-tab="2"><span class="nav-icon">🍚</span>饮食</button>
    <button class="nav-item" data-tab="3"><span class="nav-icon">🏃</span>运动</button>
    <button class="nav-item" data-tab="4"><span class="nav-icon">📊</span>更多</button>
    <button class="nav-item" data-tab="5"><span class="nav-icon">🥗</span>菜谱</button>
  </nav>
</div>

<!-- Modal: Weight -->
<div class="modal-overlay" id="weightModal">
  <div class="modal">
    <div class="flex-between mb-12"><span class="modal-title">记录体重</span><button class="btn btn-sm btn-outline" onclick="hideModal('weightModal')">✕</button></div>
    <div class="form-group">
      <label class="form-label">日期</label>
      <input class="form-input" type="date" id="wDate">
    </div>
    <div class="form-group">
      <label class="form-label">体重 (斤)</label>
      <input class="form-input" type="number" id="wValue" step="0.1" placeholder="例如：124">
    </div>
    <div class="form-group">
      <label class="form-label">备注（可选）</label>
      <input class="form-input" id="wNote" placeholder="例如：早起空腹">
    </div>
    <button class="btn btn-primary btn-block" onclick="saveWeight()">保存</button>
  </div>
</div>

<!-- Modal: Food -->
<div class="modal-overlay" id="foodModal">
  <div class="modal">
    <div class="flex-between mb-12"><span class="modal-title">添加食物</span><button class="btn btn-sm btn-outline" onclick="hideModal('foodModal')">✕</button></div>
    <div class="form-group">
      <label class="form-label">食物名称</label>
      <input class="form-input" id="fName" placeholder="例如：米饭">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">热量 (kcal)</label>
        <input class="form-input" type="number" id="fCal" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">蛋白质 (g)</label>
        <input class="form-input" type="number" id="fProtein" placeholder="0">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">碳水 (g)</label>
        <input class="form-input" type="number" id="fCarbs" placeholder="0">
      </div>
      <div class="form-group">
        <label class="form-label">脂肪 (g)</label>
        <input class="form-input" type="number" id="fFat" placeholder="0">
      </div>
    </div>
    <button class="btn btn-primary btn-block" onclick="saveFood()">添加</button>
  </div>
</div>

<!-- Modal: Exercise -->
<div class="modal-overlay" id="exModal">
  <div class="modal">
    <div class="flex-between mb-12"><span class="modal-title">记录运动</span><button class="btn btn-sm btn-outline" onclick="hideModal('exModal')">✕</button></div>
    <div class="form-group">
      <label class="form-label">日期</label>
      <input class="form-input" type="date" id="exDate">
    </div>
    <div class="form-group">
      <label class="form-label">运动类型</label>
      <select class="form-select" id="exType">
        <option value="跑步">跑步</option>
        <option value="步行">步行</option>
        <option value="骑行">骑行</option>
        <option value="游泳">游泳</option>
        <option value="力量训练">力量训练</option>
        <option value="瑜伽">瑜伽</option>
        <option value="HIIT">HIIT</option>
        <option value="跳绳">跳绳</option>
        <option value="球类">球类运动</option>
        <option value="其他">其他</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">运动名称（可选）</label>
      <input class="form-input" id="exName" placeholder="例如：5公里慢跑">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">时长 (分钟)</label>
        <input class="form-input" type="number" id="exDuration" placeholder="30">
      </div>
      <div class="form-group">
        <label class="form-label">消耗 (kcal, 可选)</label>
        <input class="form-input" type="number" id="exCal" placeholder="自动估算">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">备注</label>
      <input class="form-input" id="exNote" placeholder="感觉如何？">
    </div>
    <button class="btn btn-primary btn-block" onclick="saveExercise()">保存</button>
  </div>
</div>

<!-- Modal: Measurement -->
<div class="modal-overlay" id="measureModal">
  <div class="modal">
    <div class="flex-between mb-12"><span class="modal-title">记录维度</span><button class="btn btn-sm btn-outline" onclick="hideModal('measureModal')">✕</button></div>
    <div class="form-group">
      <label class="form-label">日期</label>
      <input class="form-input" type="date" id="mDate">
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">腰围 (cm)</label><input class="form-input" type="number" id="mWaist" step="0.1"></div>
      <div class="form-group"><label class="form-label">臀围 (cm)</label><input class="form-input" type="number" id="mHip" step="0.1"></div>
    </div>
    <div class="form-row">
      <div class="form-group"><label class="form-label">胸围 (cm)</label><input class="form-input" type="number" id="mChest" step="0.1"></div>
      <div class="form-group"><label class="form-label">臂围 (cm)</label><input class="form-input" type="number" id="mArm" step="0.1"></div>
    </div>
    <div class="form-row">

function todayStr() { return new Date().toISOString().slice(0,10); }
function fmtDate(d) { const dt = new Date(d+'T00:00:00'); return `${dt.getMonth()+1}月${dt.getDate()}日`; }
function fmtDateShort(d) { const dt = new Date(d+'T00:00:00'); return `${dt.getMonth()+1}/${dt.getDate()}`; }
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      // Use seed data if stored data is empty (no weight records)
      if (!parsed.weight || parsed.weight.length === 0) {
        data = defaultData();
        saveData();
        return;
      }
      data = { ...defaultData(), ...parsed, goals: { ...defaultData().goals, ...parsed.goals } };
      return;
    }
  } catch(e) { console.warn('Load data error', e); }
  // First ever visit: seed with pre-populated data
  data = defaultData();
  saveData();
}
function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function switchTab(i) {
  currentTab = i;
  document.querySelectorAll('.tab-page').forEach((p, idx) => p.classList.toggle('active', idx === i));
  document.querySelectorAll('.nav-item').forEach((n, idx) => n.classList.toggle('active', idx === i));
  document.getElementById('mainContent').scrollTop = 0;
  if (i === 0) renderDashboard();
  if (i === 1) renderWeight();
  if (i === 2) renderDiet();
  if (i === 3) renderExercise();
  if (i === 4) renderMore();
  if (i === 5) renderRecipe();
}

function renderCombined() {
  var el = document.getElementById('dashCombined');
  if (data.weight.length < 2) { el.innerHTML = '<div style="display:flex;align-items:center;gap:10px;padding:2px 0;"><div style="font-size:24px;">⚖️</div><div style="font-size:15px;color:var(--text3);">暂无数据，开始记录吧</div></div>'; return; }
  // Weight header
  var lastW = data.weight[data.weight.length-1].value;
  var goalW = data.goals.targetWeight;
  var html = '<div style="display:flex;align-items:center;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--border);margin-bottom:6px;">' +
    '<div style="font-size:28px;">⚖️</div>' +
    '<div><div style="font-size:20px;font-weight:700;">' + lastW + '<span style="font-size:13px;font-weight:400;color:var(--text2);margin-left:2px;">斤</span></div>' +
    '<div style="font-size:12px;color:var(--text3);">' + (goalW ? '目标 ' + goalW + ' 斤 · ' + (lastW > goalW ? '还需减 '+(lastW-goalW).toFixed(1) : (lastW < goalW ? '✅ 已达到' : '')) : '未设目标') + '</div></div></div>';
  // Progress items
  var f = data.weight[0].value, l = data.weight[data.weight.length-1].value, diff = l - f;
  var days = Math.round((new Date(data.weight[data.weight.length-1].date) - new Date(data.weight[0].date)) / 86400000);
  var changeStr = diff < 0 ? '↓' + Math.abs(diff).toFixed(1) : '↑' + diff.toFixed(1);
  var changeColor = diff < 0 ? 'var(--primary)' : 'var(--warn)';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;">' +
    '<div style="font-size:13px;">体重变化 <span style="color:var(--text3);font-size:12px;">' + f + ' → ' + l + ' 斤</span></div>' +
    '<div style="font-size:15px;font-weight:700;color:' + changeColor + '">' + changeStr + '</div></div>';
  // Body fat
  var bfRecs = data.weight.filter(function(w){return w.note && w.note.indexOf('体脂')>=0;});
  if (bfRecs.length >= 2) {
    var bf1 = parseFloat(bfRecs[0].note.match(/[\d.]+/)), bf2 = parseFloat(bfRecs[bfRecs.length-1].note.match(/[\d.]+/));
    if (bf1 && bf2) {
      var bd = bf2 - bf1, bds = bd < 0 ? '↓' + Math.abs(bd).toFixed(1) : '↑' + Math.abs(bd).toFixed(1);
      html += '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;">' +
        '<div style="font-size:13px;">体脂变化 <span style="color:var(--text3);font-size:12px;">' + bf1 + '% → ' + bf2 + '%</span></div>' +
        '<div style="font-size:15px;font-weight:700;color:var(--primary);">' + bds + '</div></div>';
    }
  }
  // Assessment
  var totalLoss = f - l;
  var weeks = Math.max(1, days / 7);
  var wl = (totalLoss / weeks).toFixed(1);
  var msg = '';
  if (wl >= 1.5) msg = '🏆 训练效果优秀！' + days + '天减重' + totalLoss.toFixed(1) + '斤，均每周' + wl + '斤';
  else if (wl >= 0.8) msg = '👍 减脂效果良好！' + days + '天减重' + totalLoss.toFixed(1) + '斤，节奏稳定';
  else msg = '💪 继续加油！' + days + '天减重' + totalLoss.toFixed(1) + '斤，坚持训练';
  html += '<div style="font-size:12px;color:var(--text2);padding-top:4px;border-top:1px solid var(--border);margin-top:4px;">' + msg + '</div>';
  el.innerHTML = html;
}

function renderWeight() {
  renderWeightChart();
  const list = document.getElementById('weightList');
  if (!data.weight.length) { list.innerHTML = '<div class="empty"><div class="empty-icon">⚖️</div>还没有体重记录<br>点击右上角「记录」开始</div>'; return; }
  const sorted = [...data.weight].reverse();
  const stats = data.weight.length >= 2 ? { min: Math.min(...data.weight.map(w=>w.value)), max: Math.max(...data.weight.map(w=>w.value)), first: data.weight[0].value, last: data.weight[data.weight.length-1].value } : null;
  document.getElementById('weightStats').innerHTML = stats
    ? `共 ${data.weight.length} 条 · 最低 ${stats.min} 斤 · 最高 ${stats.max} 斤 · 变化 ${(stats.last - stats.first) >= 0 ? '+' : ''}${(stats.last - stats.first).toFixed(1)}`
    : '';
  list.innerHTML = sorted.map(w => `
    <div class="list-item">
      <div class="li-left">
        <div class="li-title">${w.value} <span style="font-weight:400;font-size:13px;color:var(--text2);">斤</span></div>
        <div class="li-sub">${fmtDate(w.date)}${w.note ? ' · '+w.note : ''}</div>
      </div>
      <button class="btn btn-sm btn-outline" onclick="deleteWeight('${w.date}')" style="color:var(--danger);border-color:transparent;">删除</button>
    </div>
  `).join('');
}
function renderWeightChart() {
  const canvas = document.getElementById('weightChart');
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width || canvas.parentElement.clientWidth || 300;
  canvas.height = 200;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height, pad = { top: 20, bottom: 30, left: 45, right: 20 };
  const chartW = W - pad.left - pad.right, chartH = H - pad.top - pad.bottom;
  ctx.clearRect(0, 0, W, H);
  const pts = data.weight;
  if (pts.length < 2) {
    ctx.fillStyle = '#94a3b8'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('至少需要 2 条记录才能显示图表', W/2, H/2);
    return;
  }
  const values = pts.map(p => p.value);
  const min = Math.floor(Math.min(...values) - 1), max = Math.ceil(Math.max(...values) + 1);
  const range = max - min || 1;
  const x = (i) => pad.left + (i / (pts.length-1)) * chartW;
  const y = (v) => pad.top + chartH - ((v - min) / range) * chartH;
  // Grid
  ctx.strokeStyle = '#f1f5f9'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const yy = pad.top + (i/4)*chartH;
    ctx.beginPath(); ctx.moveTo(pad.left, yy); ctx.lineTo(W-pad.right, yy); ctx.stroke();
    ctx.fillStyle = '#94a3b8'; ctx.font = '11px sans-serif'; ctx.textAlign = 'right';
    ctx.fillText((max - (i/4)*range).toFixed(1), pad.left-5, yy+4);
  }
  // X labels
  ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
  const step = Math.max(1, Math.floor(pts.length / 6));
  pts.forEach((p, i) => { if (i % step === 0 || i === pts.length-1) ctx.fillText(fmtDateShort(p.date), x(i), H-5); });
  // Area
  ctx.beginPath(); ctx.moveTo(x(0), y(values[0]));
  pts.forEach((p, i) => ctx.lineTo(x(i), y(p.value)));
  ctx.lineTo(x(pts.length-1), H-pad.bottom); ctx.lineTo(x(0), H-pad.bottom); ctx.closePath();
  const grad = ctx.createLinearGradient(0, pad.top, 0, H-pad.bottom);
  grad.addColorStop(0, 'rgba(16,185,129,.2)'); grad.addColorStop(1, 'rgba(16,185,129,0)');
  ctx.fillStyle = grad; ctx.fill();
  // Line
  ctx.beginPath(); ctx.moveTo(x(0), y(values[0]));
  pts.forEach((p, i) => ctx.lineTo(x(i), y(p.value)));
  ctx.strokeStyle = '#10b981'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke();
  // Dots
  pts.forEach((p, i) => {
    ctx.beginPath(); ctx.arc(x(i), y(p.value), 4, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = '#10b981'; ctx.lineWidth = 2; ctx.stroke();
  });
  // Goal line
  if (data.goals.targetWeight) {
    const gy = y(data.goals.targetWeight);
    ctx.beginPath(); ctx.setLineDash([6,4]); ctx.moveTo(pad.left, gy); ctx.lineTo(W-pad.right, gy);
    ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = 1.5; ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = '#f59e0b'; ctx.font = '11px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText('目标 '+data.goals.targetWeight, W-pad.right-60, gy-4);
  }
}
function saveWeight() {
  const date = document.getElementById('wDate').value || todayStr();
  const value = parseFloat(document.getElementById('wValue').value);
  if (!value) { showToast('请输入体重'); return; }
  const note = document.getElementById('wNote').value;
  const idx = data.weight.findIndex(w => w.date === date);
  if (idx >= 0) data.weight[idx] = { date, value, note };
  else data.weight.push({ date, value, note });
  data.weight.sort((a,b) => a.date.localeCompare(b.date));
  saveData();
  hideModal('weightModal');
  document.getElementById('wValue').value = ''; document.getElementById('wNote').value = '';
  showToast('✅ 体重已记录');
  renderWeight(); renderDashboard();
}
function deleteWeight(date) {
  showConfirm(`确定删除 ${fmtDate(date)} 的体重记录？`, () => {
    data.weight = data.weight.filter(w => w.date !== date);
    saveData();
    renderWeight(); renderDashboard();
    showToast('已删除');
  });
}

function renderWaistChart() {
  var canvas = document.getElementById('waistChart');
  if (!canvas) return;
  var rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width || canvas.parentElement.clientWidth || 300;
  canvas.height = 160;
  var ctx = canvas.getContext('2d');
  var W = canvas.width, H = canvas.height, pad = { top: 15, bottom: 25, left: 35, right: 15 };
  var cw = W - pad.left - pad.right, ch = H - pad.top - pad.bottom;
  ctx.clearRect(0, 0, W, H);
  var pts = data.measurements.slice().sort(function(a,b){return a.date.localeCompare(b.date);}).filter(function(m){return m.waist;});
  if (pts.length < 2) {
    ctx.fillStyle = '#94a3b8'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('至少需要 2 条记录', W/2, H/2 + 5);
    return;
  }
  var v = pts.map(function(p){return p.waist;});
  var min = Math.floor(Math.min.apply(null, v) - 2), max = Math.ceil(Math.max.apply(null, v) + 2);
  var range = max - min || 1;
  function x(i) { return pad.left + (i / (pts.length-1)) * cw; }
  function yy(val) { return pad.top + ch - ((val - min) / range) * ch; }
  // Grid
  ctx.strokeStyle = '#f1f5f9'; ctx.lineWidth = 1;
  for (var i = 0; i <= 3; i++) { var gy = pad.top + (i/3)*ch; ctx.beginPath(); ctx.moveTo(pad.left, gy); ctx.lineTo(W-pad.right, gy); ctx.stroke();
    ctx.fillStyle = '#94a3b8'; ctx.font = '10px sans-serif'; ctx.textAlign = 'right'; ctx.fillText((max - (i/3)*range).toFixed(0), pad.left-4, gy+3); }
  // X labels
  ctx.fillStyle = '#94a3b8'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
  var step = Math.max(1, Math.floor(pts.length / 5));
  pts.forEach(function(p, i) { if (i % step === 0 || i === pts.length-1) ctx.fillText(p.date.slice(5), x(i), H-3); });
  // Area
  ctx.beginPath(); ctx.moveTo(x(0), yy(v[0]));
  pts.forEach(function(p, i) { ctx.lineTo(x(i), yy(p.waist)); });
  ctx.lineTo(x(pts.length-1), H-pad.bottom); ctx.lineTo(x(0), H-pad.bottom); ctx.closePath();
  var grad = ctx.createLinearGradient(0, pad.top, 0, H-pad.bottom);
  grad.addColorStop(0, 'rgba(59,130,246,.2)'); grad.addColorStop(1, 'rgba(59,130,246,0)');
  ctx.fillStyle = grad; ctx.fill();
  // Line
  ctx.beginPath(); ctx.moveTo(x(0), yy(v[0]));
  pts.forEach(function(p, i) { ctx.lineTo(x(i), yy(p.waist)); });
  ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2.5; ctx.lineJoin = 'round'; ctx.stroke();
  // Dots
  pts.forEach(function(p, i) {
    ctx.beginPath(); ctx.arc(x(i), yy(p.waist), 3.5, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#3b82f6'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(p.waist + 'cm', x(i), yy(p.waist) - 8);
  });
}

function exportData() {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = `健身记录_${todayStr()}.json`;
  a.click(); URL.revokeObjectURL(url);
  showToast('✅ 数据已导出');
}
function importData(e) {
  const file = e.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const d = JSON.parse(ev.target.result);
      data = { ...defaultData(), ...d, goals: { ...defaultData().goals, ...d.goals } };
      saveData();
      showToast('✅ 数据已导入');
      renderAll();
    } catch(err) { showToast('❌ 文件格式错误'); }
  };
  reader.readAsText(file);
  e.target.value = '';
}
function clearAllData() {
  showConfirm('确定要清空所有数据？此操作不可恢复！', () => {
    data = defaultData();
    saveData();
    renderAll();
    showToast('已清空');
  });
}

  renderDashboard(); if (currentTab === 1) renderWeight(); if (currentTab === 2) renderDiet();

let currentRecipeFilter = 'all';
let currentRecipeTag = 'all';

function renderRecipe() {
  var filtered = RECIPES;
  if (currentRecipeFilter !== 'all') filtered = filtered.filter(function(r){return r.type === currentRecipeFilter;});
  if (currentRecipeTag !== 'all') filtered = filtered.filter(function(r){return r.tag === currentRecipeTag;});
  // Tag filter buttons
  var tagEl = document.getElementById('recipeTagFilter');
  tagEl.innerHTML = ['全部','减脂','增肌'].map(function(t){
    var active = (t === (currentRecipeTag === 'all' ? '全部' : currentRecipeTag));
    return '<button class="btn btn-sm ' + (active ? 'btn-primary' : 'btn-outline') + '" onclick="filterRecipeTag(\'' + (t==='全部'?'all':t) + '\')">' + t + '</button>';
  }).join('');
  // Type filter active state
  document.querySelectorAll('#recipeTypeFilter .meal-tab').forEach(function(btn){
    btn.classList.toggle('active', btn.getAttribute('onclick').includes("'" + currentRecipeFilter + "'"));
  });
  // List
  var el = document.getElementById('recipeList');
  if (!filtered.length) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🥗</div>暂无匹配菜谱</div>';
    return;
  }
  el.innerHTML = filtered.map(function(r){
    var tagColor = r.tag === '增肌' ? 'var(--info)' : 'var(--primary)';
    return '<div class="card" style="padding:14px;margin-bottom:10px;">' +
      '<div class="flex-between"><strong>' + r.name + '</strong>' +
      '<span style="font-size:12px;color:' + tagColor + ';font-weight:600;">' + r.tag + '</span></div>' +
      '<div style="font-size:12px;color:var(--text3);margin:4px 0;">' +
      r.calories + ' kcal · 蛋白质' + r.protein + 'g · 碳水' + r.carbs + 'g · 脂肪' + r.fat + 'g</div>' +
      '<div style="font-size:12px;color:var(--text2);margin:4px 0;">🛒 ' + r.ingredients.join('、') + '</div>' +
      '<div style="font-size:12px;color:var(--text3);margin-top:4px;">👨‍🍳 ' + r.steps + '</div>' +
      '</div>';
  }).join('');
}

function filterRecipe(type) {
  currentRecipeFilter = type;
  renderRecipe();
}

function filterRecipeTag(tag) {
  currentRecipeTag = tag;
  renderRecipe();
}

// ============ PPL DETECTION & TRAINING PLAN ============
function detectLastPPL() {
  var strengthEx = data.exercises.filter(function(e) { return e.type === '力量训练'; });
  if (!strengthEx.length) return null;
  strengthEx.sort(function(a, b) { return b.date.localeCompare(a.date); });
  var last = strengthEx[0].name || '';
  if (/(胸|推|肩)/.test(last)) return 'push';
  if (/(背|拉|引体)/.test(last)) return 'pull';
  if (/(腿|深蹲|倒蹬|哈克)/.test(last)) return 'legs';
  return null;
}

function getNextWorkout() {
  var last = detectLastPPL();
  var cycle = ['push', 'pull', 'legs'];
  var labels = { push: '推胸+肩部训练', pull: '拉背+二头训练', legs: '腿部训练' };
  if (!last) return { name: labels.push, type: 'push', day: 'Day 1' };
  var idx = cycle.indexOf(last);
  var next = cycle[(idx + 1) % 3];
  return { name: labels[next], type: next, day: 'Day 1' };
}

let planExpanded = false;
function togglePlan() { planExpanded = !planExpanded; renderPlan(); }

function getDayPlan(type, direction) {
  var isGain = direction === '增肌';
  var plans = {
    push: {
      name: '推胸+肩部训练', emoji: '💪', carbs: '中碳',
      exercises: isGain
        ? ['杠铃卧推 5组×8-10次', '上斜哑铃推举 4组×10-12次', '肩部推举 4组×10-12次', '哑铃飞鸟 4组×12次', '绳索下拉 4组×12次', '面拉 3组×15次']
        : ['杠铃卧推 4组×12-15次', '上斜哑铃推举 3组×12-15次', '肩部推举 3组×12-15次', '哑铃飞鸟 3组×15次', '绳索下拉 3组×15次', '面拉 3组×15次'],
      cardio: isGain ? '' : '🏃 爬坡 20-25分钟'
    },
    pull: {
      name: '拉背+二头训练', emoji: '🏋️', carbs: '中碳',
      exercises: isGain
        ? ['引体向上(辅助) 4组×8-10次', '坐姿划船 4组×10-12次', '高位下拉 4组×10-12次', '杠铃弯举 4组×8-10次', '哑铃弯举 3组×10次', '面拉 3组×15次']
        : ['引体向上(辅助) 3组×12-15次', '坐姿划船 3组×12-15次', '高位下拉 3组×12-15次', '哑铃弯举 3组×12-15次', '面拉 3组×15次'],
      cardio: isGain ? '' : '🏃 爬坡 20分钟'
    },
    legs: {
      name: '腿部训练', emoji: '🦵', carbs: '高碳',
      exercises: isGain
        ? ['杠铃深蹲 5组×8-10次', '倒蹬 4组×10-12次', '腿弯举 4组×10-12次', '腿屈伸 4组×12次', '髋外展 3组×15次', '站姿提踵 4组×15次']
        : ['杠铃深蹲 4组×12-15次', '倒蹬 3组×12-15次', '腿弯举 3组×12-15次', '腿屈伸 3组×15次', '髋外展 3组×15次'],
      cardio: isGain ? '' : '🏃 爬坡 25分钟'
    },
    rest: {
      name: '休息日', emoji: '😌', carbs: '低碳',
      exercises: [], cardio: ''
    }
  };
  return plans[type];
}

function generatePlan() {
  var last = detectLastPPL();
  var cycle = ['push', 'pull', 'legs'];
  var direction = data.goals.direction || '减脂';
  var freq = data.goals.weeklyExercise || 3;
  var startIdx = 0;
  if (last) startIdx = (cycle.indexOf(last) + 1) % 3;
  // Pattern based on weekly frequency
  var pattern;
  if (freq <= 3) pattern = ['train','rest','train','rest','train'];
  else if (freq === 4) pattern = ['train','rest','train','train','rest'];
  else if (freq === 5) pattern = ['train','train','rest','train','train'];
  else pattern = ['train','train','rest','train','train','rest','train'];
  var days = [];
  var ti = 0;
  for (var i = 0; i < pattern.length; i++) {
    if (pattern[i] === 'train') {
      var type = cycle[(startIdx + ti) % 3];
      var plan = getDayPlan(type, direction);
      plan.carbs = type === 'legs' ? '高碳' : '中碳';
      days.push(plan);
      ti++;
    } else {
      days.push(getDayPlan('rest', direction));
    }
  }
  return days;
}

function renderNextWorkout() {
  var next = getNextWorkout();
  var el = document.getElementById('dashNextWorkout');
  if (!el) return;
  var direction = data.goals.direction || '减脂';
  el.innerHTML = '<div style="font-size:15px;font-weight:600;margin-bottom:4px;">下一次训练：<span style="color:var(--primary);">' + next.name + '</span></div>' +
    '<div style="font-size:13px;color:var(--text3);">当前方向：' + direction + ' · PPL轮转训练</div>';
}

function renderPlan() {
  var el = document.getElementById('dashPlan');
  if (!el) return;
  var days = generatePlan();
  if (!planExpanded) {
    var sum = days[0].emoji + ' ' + days[0].name + ' · ' + days[0].carbs;
    if (days.length > 1 && days[1].name === '休息日') sum += ' | 明日休息·低碳';
    el.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center;cursor:pointer;padding:2px 0;" onclick="togglePlan()">' +
      '<span style="font-size:14px;font-weight:500;">' + sum + '</span>' +
      '<span style="font-size:12px;color:var(--text3);">展开 ▸</span></div>';
    return;
  }
  el.innerHTML = days.map(function(d, i){
    var dt = new Date(); dt.setDate(dt.getDate() + i + 1);
    var dStr = (dt.getMonth()+1) + '/' + dt.getDate();
    var cColor = d.carbs === '高碳' ? 'var(--primary)' : d.carbs === '中碳' ? 'var(--warn)' : 'var(--text3)';
    var isRest = d.name === '休息日';
    return '<div style="padding:' + (isRest ? '6px' : '8px') + ' 0;' + (i < days.length-1 ? 'border-bottom:1px solid var(--border);' : '') + '">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:' + (isRest ? '0' : '4px') + ';">' +
      '<div style="font-weight:600;font-size:13px;">' + d.emoji + ' ' + d.name + ' <span style="font-weight:400;font-size:11px;color:var(--text3);">' + dStr + '</span></div>' +
      '<span style="font-size:10px;padding:1px 6px;border-radius:8px;background:var(--bg);color:' + cColor + ';font-weight:600;">' + d.carbs + '</span></div>' +
      (isRest ? '<div style="font-size:12px;color:var(--text3);">恢复身体 · 控制碳水 · 多吃蔬菜蛋白质</div>' :
        '<div style="font-size:12px;line-height:1.7;color:var(--text2);">' +
        d.exercises.map(function(ex){ return '<div>· ' + ex + '</div>'; }).join('') +
        (d.cardio ? '<div style="color:var(--warn);margin-top:1px;">' + d.cardio + '</div>' : '') +
        '</div>') +
      '</div>';
  }).join('') +
  '<div style="text-align:center;padding-top:6px;cursor:pointer;" onclick="togglePlan()">' +
  '<span style="font-size:12px;color:var(--text3);">收起 ▾</span></div>';
}

switchTab(0);
